# Q2 follow-up: does a gentler global warmup reduce the early-training
# collapse pattern seen across gated_concat/channelwise_gated_concat seeds
# (e.g. runs/q2_ScalarVsChannelwise/20260822_203429_bs16_gated_concat, seed
# 50: val_abs_trans jumps from 0.001778 at epoch 1 to 0.004165 and is frozen
# there for the rest of training -- starting *inside* the 4-epoch warmup
# window, at a point where the schedule multiplier is already ~0.667 of
# peak)? Unlike gate_init_prob/lr_fusion, this is a whole-model change (every
# param group shares one lr_schedule curve -- see utils/train_utils.py's
# HeadLRDecayManager.apply_lr_scale), not scoped to the fusion gate.
#
# Deliberately NOT reusing scripts/optuna_tuning/optuna_phase3_schedule.py's
# existing pct_start/start_lr_mult search (runs/optuna_phase3_schedule/):
# every one of its trials with start_lr_mult < ~0.25 was pruned before
# completion (killed on early trajectory, which is systematically biased
# against a schedule whose whole premise is a slower start), so the region
# this experiment cares about was never fairly evaluated there. A manual
# grid sidesteps that -- no pruner, every point runs to completion.
#
# Three explicit points instead of a pct_start x start_lr_mult cross product,
# each changing exactly one knob from the previous step (control -> moderate
# changes start_lr_mult only isn't included since control already exists as
# the unmodified baseline; moderate -> gentle changes start_lr_mult only;
# gentle -> very_gentle changes pct_start only) so an effect seen between
# adjacent presets is attributable to one parameter:
#   moderate:    pct_start 0.15, start_lr_mult 0.30
#   gentle:      pct_start 0.15, start_lr_mult 0.15
#   very_gentle: pct_start 0.25, start_lr_mult 0.15
# The control (pct_start 0.05, start_lr_mult 0.5, current default) already
# exists as 5-seed baseline data (runs/q2_ScalarVsChannelwise_gradclip) and
# is not regenerated here.
#
# model.gate_init_prob and training.lr_fusion are left at their defaults so
# this stays isolated to warmup shape alone, comparable against the other two
# q2_gate_init_prob_* / q2_gate_lr_sweep_* grids without confounding them.
#
# Template/seeds/split_seed match every other q2 gradclip-family comparison
# this session for direct comparability.
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  model.fusion: "gated_concat"
  data.split_seed: 40
  group_aware_split: true

grid:
  training.seed: [46, 47, 48, 49, 50]

variants:
  - name: moderate
    overrides:
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.3

  - name: gentle
    overrides:
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.15

  - name: very_gentle
    overrides:
      training.lr_schedule.pct_start: 0.25
      training.lr_schedule.start_lr_mult: 0.15
