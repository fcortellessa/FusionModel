# gated_cross_attention_2d with the gate initialised at 0.5 instead of the module default 0.1.
# Single varying factor vs gated_cross_attention_2d_divisor4_spec.yml (configs 001/003, splits 36/37):
# model.gate_init_prob 0.1 (module default, key absent) -> 0.5. build_fusion forwards model.gate_init_prob to
# fusions that declare it, so no code change is needed; test.py/infer rebuild the same architecture (the
# value only sets the gate-layer bias at initialisation, loaded weights override it).
# Hypothesis: with g0=0.1 the module starts ~RGB-only and the 2D runs were still improving at epoch 80
# (train rot 0.11-0.13 deg vs 0.08 for the 1D se_gated_cross_attention), i.e. tactile may open up too slowly.
# Compare on the same splits against configs 001 (split 36) and 003 (split 37).
template_config: configs/generated/divisor4_missing_methods/004_se_gated_cross_attention_divisor4_split_seed-36_ce57f6.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  model.pre_head_channel_divisor: 4
  model.dual_fusion: false
  model.gate_init_prob: 0.5
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.01
  training.early_stopping.smoothing_alpha: 0.3
  training.checkpoint_selection.type: both

grid:
  data.split_seed: [36, 37]

variants:
  - name: gated_cross_attention_2d_gate05_divisor4
    overrides:
      model.fusion: gated_cross_attention_2d
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
