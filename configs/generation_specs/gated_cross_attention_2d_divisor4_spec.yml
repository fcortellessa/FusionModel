# 2D-token cross-attention fusions at divisor 4 (fusion/gated_cross_attention_2d.py), compared against
# the existing divisor-4 candidates (concat, gated, gated_concat, se_channel_gated_concat,
# se_gated_cross_attention, ...) on the same split seeds.
#
# Variants differ only in model.fusion:
#   gated_cross_attention_2d     real 2D tokens + per-modality position encodings + token gate only
#                                (no SE branch; the probe showed the SE block of the 1D module is a
#                                constant per-channel scale, see docs/analysis_notes.md) -- run this first
#   se_gated_cross_attention_2d  same, plus the per-scale SE logit branch (SE ablation partner)
# Generate with --grid-major so files run seed by seed (no-SE then SE on each split): a paired
# comparison is available after every second run, and the split is rebuilt only once per seed.
# Planned follow-ups (new specs, not here): se_gated_cross_attention_2d_pool (bottleneck ablation) and
# se_gated_cross_attention_2d_notacpos_onlyRGBposenc (tactile position-encoding ablation).
#
# Everything else matches dual_se_gated_cross_attention_divisor4_spec.yml / the divisor-4
# se_gated_cross_attention runs (divisor 4, MLP sizes, early stopping 0.01/0.3, lr_backbone,
# rot_scaling_factor, checkpoint_selection both). Start with splits 36-40; extend the grid to 41-45
# only if the first 5 look promising.
template_config: configs/generated/divisor4_missing_methods/004_se_gated_cross_attention_divisor4_split_seed-36_ce57f6.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  model.pre_head_channel_divisor: 4
  model.dual_fusion: false
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.01
  training.early_stopping.smoothing_alpha: 0.3
  training.checkpoint_selection.type: both

grid:
  data.split_seed: [36, 37, 38, 39, 40]

variants:
  - name: gated_cross_attention_2d_divisor4
    overrides:
      model.fusion: gated_cross_attention_2d
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
  - name: se_gated_cross_attention_2d_divisor4
    overrides:
      model.fusion: se_gated_cross_attention_2d
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
