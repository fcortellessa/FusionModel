# Extends 4 candidates to seeds 41-45 (the final_ablation standard set has used 36-40 throughout
# this series): gated_concat +divisor4, se_channel_gated_concat +divisor4, dual_gated_concat
# +divisor4 -- each already has seeds 36-38 (se_channel also 39-40) -- plus gated +divisor4,
# a combination never tested before this spec (sanity-checked: forward/backward clean, gate
# shape (2,) as expected -- "gated" is a weighted-sum fusion, not concat-preserving, so it
# doesn't hit the per-channel-gate + dual_fusion logging bug fixed for se_channel's dual variant;
# gated also isn't tested with dual_fusion here as a result).
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  model.pre_head_channel_divisor: 4
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.03
  training.early_stopping.smoothing_alpha: 0.2

grid:
  data.split_seed: [41, 42, 43, 44, 45]

variants:
  - name: gated_concat_divisor4
    overrides:
      model.fusion: gated_concat
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16

  - name: se_channel_gated_concat_divisor4
    overrides:
      model.fusion: se_channel_gated_concat
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16

  - name: dual_gated_concat_divisor4
    overrides:
      model.fusion: gated_concat
      model.dual_fusion: true
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16

  - name: gated_divisor4
    overrides:
      model.fusion: gated
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
