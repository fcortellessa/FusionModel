# Extends dual_se_channel_divisor4_spec.yml (seeds 36-38) + dual_se_channel_divisor4_seeds39_40_spec.yml
# (39-40) to the remaining 5 seeds (41-45) of the main comparison set, so dual_se_channel_gated_concat
# +divisor4 -- currently the best overall candidate on seeds 36-40 (rot_x 0.462 vs 0.503 for the
# non-dual se_channel +divisor4, which already has seeds 41-45) -- reaches the same seed coverage
# before being reported as the winner.
#
# Same template, fixed_overrides (incl. the corrected early-stopping min_delta=0.03/
# smoothing_alpha=0.2) and variant as the seeds 36-40 specs.
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  model.pre_head_channel_divisor: 4
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.03
  training.early_stopping.smoothing_alpha: 0.2

grid:
  data.split_seed: [41, 42, 43, 44, 45]

variants:
  - name: dual_se_channel_gated_concat_divisor4
    overrides:
      model.fusion: se_channel_gated_concat
      model.dual_fusion: true
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
