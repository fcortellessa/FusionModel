# Combines the two head-reduction mechanisms that each independently beat the full-head
# se_channel_gated_concat baseline on all 3 tested seeds:
#   pre_head_channel_divisor=4  (0.514 +- 0.080 deg mean test rot_x vs baseline's 0.635 +- 0.078)
#   head_bottleneck_rank=64     (0.596 +- 0.068 deg)
# Tests whether the two effects stack (input-size reduction + rank-constrained mapping of
# whatever input remains) or interact negatively from over-constraining capacity from two
# directions at once. See pre_head_channel_divisor_vs_se_channel_spec.yml and
# head_bottleneck_rank_vs_se_channel_spec.yml for the individual results/motivation.
#
# Also corrects training.early_stopping.min_delta/smoothing_alpha: replaying
# PerHeadEarlyStoppingManager's exact logic against the divisor=4 seed-36 run's real validation
# trajectory showed its per-head "bad epoch" counters kept resetting to 0 throughout all 80
# epochs (for both rot and trans), even though the run's actual best epoch was 37 -- the old
# min_delta=0.01 (1% relative) threshold was easy to cross from epoch-to-epoch noise alone,
# especially for translation at its sub-mm absolute scale, so patience never got a clean run at
# accumulating. min_delta=0.03 (require a real 3% relative improvement) and smoothing_alpha=0.2
# (more EMA smoothing, from the previous 0.3) are the fix -- NOTE this means any other
# final_ablation/se_channel comparison this run is measured against was trained under the old,
# effectively-inert early stopping, so its total epoch count isn't directly comparable to theirs
# (this run may legitimately stop well before 80 epochs; that's the intended behavior now, not a
# different result worth flagging as an anomaly).
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.03
  training.early_stopping.smoothing_alpha: 0.2

grid:
  data.split_seed: [36, 37, 38]

variants:
  - name: se_channel_gated_concat_divisor4_rank64
    overrides:
      model.fusion: se_channel_gated_concat
      model.dual_fusion: false
      model.pre_head_channel_divisor: 4
      model.head_bottleneck_rank: 64
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
