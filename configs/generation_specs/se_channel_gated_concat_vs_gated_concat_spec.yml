# Tests whether gated_concat's near-constant gate (see final_ablation gate diagnostics:
# val_fusion_gate_std ~0.02-0.03, mean-gate/shuffled-gate ablation barely moves accuracy)
# is a symptom of its gate MLP's Linear(44800 -> 32) bottleneck: 1.4M weights fit on
# 5,229 training samples, with the compression itself left for the network to learn from
# too little data.
#
# se_channel_gated_concat (fusion/gated_concat.py::_BaseSEChannelGatedConcat) replaces
# that learned compression with a fixed one: each of the 224 channels (P3:32/P4:64/P5:128)
# is pooled over its 10x10 grid to (mean, mean|x|) before any weights are applied, giving
# the gate MLP an 896-dim, LayerNorm'd input and a Linear(896 -> 64) first layer (~57k
# weights, ~25x fewer) instead of the raw 44,800-dim one. It also gates per channel (224
# gates/stream) rather than gated_concat's single scalar/stream, so a regression against
# gated_concat isolates "does fixing the bottleneck reduce the gate collapse", while any
# residual gain could also just be the finer granularity -- not disentangled by this
# comparison alone.
#
# Only se_channel_gated_concat is generated here -- the gated_concat control already
# exists (byte-for-byte the same overrides below) as the final_ablation runs, e.g.
# runs/final_ablation/20260918_162529_bs16_gated_concat for split seed 40 -- so it isn't
# regenerated/retrained. se_channel_gated_concat uses gated_concat's own head (colleague
# head: mlp_quat 256/1024/0, mlp_trans 1024/1024/16) rather than the larger channelwise
# head, so the head size is not a confound when comparing the two against each other.
#
# Same template, fixed_overrides and split-seed grid (36-40) as
# configs/final_ablation_remaining_spec.yml / configs/final_ablation_spec.yml, so results
# are directly comparable to those existing final_ablation gated_concat runs.
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.01
  training.early_stopping.smoothing_alpha: 0.3

grid:
  data.split_seed: [36, 37, 38, 39, 40]

variants:
  - name: se_channel_gated_concat
    overrides:
      model.fusion: se_channel_gated_concat
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
