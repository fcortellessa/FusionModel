# Same as grad_clip_per_parameter_group_vs_gated_concat_spec.yml (see that file for the full
# motivation), but applied to se_channel_gated_concat -- the current best-performing candidate
# in this ablation -- rather than gated_concat. See pre_head_layernorm_vs_se_channel_spec.yml
# for why this is run in addition to, not instead of, the gated_concat version.
#
# Compared against se_channel_gated_concat (plain, global clip) --
# runs/se_channel_gated_concat_vs_gated_concat/, same seeds -- not regenerated here.
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.01
  training.early_stopping.smoothing_alpha: 0.3
  training.grad_clip.per_parameter_group: true

grid:
  data.split_seed: [36, 37, 38]

variants:
  - name: se_channel_gated_concat_grad_clip_per_group
    overrides:
      model.fusion: se_channel_gated_concat
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16
