# Q4: is early specialization (dual fusion) better than late specialization
# (a task-feature adapter on a shared fusion)?
#
# The two variants deliberately use DIFFERENT base fusions now (see
# conversation history, 2026-09-04):
#
# - dual_gated_concat: gated_concat base, + dual_fusion (independent gate per
#   task branch instead of one shared gate). MUST keep gated_concat as the
#   base -- dual_fusion works by giving each branch its own copy of the base
#   fusion module's parameters, so a parameter-free base (plain concat) would
#   make fusion_rotation/fusion_translation two identical no-op copies of the
#   same computation: a degenerate, uninformative comparison. Only +1.33%
#   params, no cold-start identity-adapter behavior, so kept at the same 80
#   epochs as the q2_ScalarVsChannelwise_gradclip baseline for direct
#   comparability.
# - task_specific_concat: plain concat base + task_feature_adapter
#   (residual_gate type -- see conversation history for why residual_gate over
#   channel_attention: the latter blows up to ~2B params at this model's
#   fused_dim=44800, residual_gate stays a fixed ~2.9M/adapter regardless of
#   fused_dim). Switched from gated_concat to plain concat as the base: with
#   gated_concat, the adapter's sigmoid gate sits on top of the base fusion's
#   own sigmoid gate, so any gain is confounded with "two stacked gates" vs.
#   "task-specific re-weighting" per se. Plain concat is parameter-free, so
#   the adapter is the ONLY source of gating and the comparison isolates its
#   effect. The matching no-adapter baseline is the existing plain-concat
#   q1_ConcatVsGated_gradclip results (seeds 46-50, same split_seed/
#   group_aware_split) -- not re-run here. 120 epochs (not the default 80):
#   adds ~5.42% new, near-identity-initialized parameters that need training
#   time to learn a deviation from identity (see conversation history for the
#   Sigmoid(0)=0.5 cold-start caveat -- the adapter does not truly start at
#   identity despite the near-zero weight init).
#
# Template: the actual baseline gated_concat/seed46 config from
# q2_ScalarVsChannelwise_gradclip, so grad_clip/warmup_cosine/early_stopping/
# weight_decay/etc. are identical to the baselines being compared against --
# model.fusion is overridden per-variant below.
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  data.split_seed: 40
  group_aware_split: true

grid:
  training.seed: [46, 47, 48, 49, 50]

variants:
  - name: task_specific_concat
    overrides:
      model.fusion: concat
      model.task_feature_adapter.enabled: true
      model.task_feature_adapter.type: "residual_gate"
      training.epochs: 120

  - name: dual_gated_concat
    overrides:
      model.fusion: gated_concat
      model.dual_fusion: true
      training.epochs: 80
