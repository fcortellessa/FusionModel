# Corrected rgb_only/tactile_only arms for the se_gca modality ablation (seeds 41-45):
# per explicit instruction, these single-stream baselines use se_channel_gated_concat +
# pre_head_channel_divisor=4 (matching the dual_se_channel_divisor4 head-shrink mechanism),
# not plain concat. The cross-attention ("fusion") arm is a separate continuation of the
# existing se_gated_cross_attention_seeds38_45_both_spec.yml runs, not generated here.
#
# Same fixed_overrides/early-stopping as se_gated_cross_attention_seeds36_40_spec.yml so
# results stay comparable to that sweep's se_channel_gated_concat (two-stream) variant,
# differing only in model.streams (single modality) and the added divisor.
template_config: configs/generated/q2/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  model.fusion: se_channel_gated_concat
  model.dual_fusion: false
  model.pre_head_channel_divisor: 4
  model.mlp_quat_1: 256
  model.mlp_quat_2: 1024
  model.mlp_quat_3: 0
  model.mlp_trans_1: 1024
  model.mlp_trans_2: 1024
  model.mlp_trans_3: 16
  training.checkpoint_selection.type: both
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.01
  training.early_stopping.smoothing_alpha: 0.3

grid:
  data.split_seed: [41, 42, 43, 44, 45]

variants:
  - name: tactile_only_divisor4
    overrides:
      model.streams: [digit_image]

  - name: rgb_only_divisor4
    overrides:
      model.streams: [rgb_image]
