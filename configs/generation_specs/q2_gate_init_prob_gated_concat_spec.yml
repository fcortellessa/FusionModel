# Q2 follow-up: does biasing the sigmoid gate's *initial* output toward
# trusting/passing-through both streams (gate_init_prob), instead of the
# previous neutral 0.5 init, reduce the near-zero-variance gate collapse seen
# across gated_concat's baseline, floor, and lr_fusion variants (see
# q2_gate_floor_ablation, q2_gate_lr_sweep)? Unlike the hard floor
# (gated_concat_floor), this only changes the starting point -- the gate can
# still move anywhere in (0, 1) over training, including full suppression, so
# it doesn't trade away the plain sigmoid's self-healing property the way the
# floor and residual formulations do.
#
# Only 0.7 and 0.88 are generated here -- the 0.5 control already exists as
# the unmodified baseline (runs/q2_ScalarVsChannelwise_gradclip, seeds
# 46-50, no gate_init_prob override, i.e. the previous zero-bias/0.5 default).
# Same 5 seeds and same split_seed=40 as that baseline for direct
# comparability. Compare via val_fusion_gate_std and val_fusion_gate_mean in
# metrics.csv (not just loss) -- std moving off ~0 is the actual signal this
# experiment is testing for.
#
# Template carries the exact grad_clip/warmup_cosine/early_stopping settings
# the q2 gradclip grid used (same template as q2_gate_lr_sweep_spec.yml).
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  model.fusion: "gated_concat"
  data.split_seed: 40
  group_aware_split: true

grid:
  training.seed: [46, 47, 48, 49, 50]
  model.gate_init_prob:
    - 0.7
    - 0.88
