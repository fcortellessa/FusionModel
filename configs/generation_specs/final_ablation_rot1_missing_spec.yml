# Fills the missing rot_scaling_factor=1.0 cells of the final ablation for the three candidates that
# were not completed at scale 1.0 (found by scanning runs/final_ablation, 2026-09-20):
#   gated                                      -> split seeds 36, 37, 38, 39   (only 40 existed)
#   residual_gated_concat                      -> split seeds 36, 37, 38       (39, 40 existed)
#   channelwise_residual_gated_concat_local    -> split seeds 36, 37, 38       (39 x2, 40 existed)
# 10 runs. Same template / fixed overrides / per-candidate head sizes as final_ablation_remaining_spec.yml
# (the existing scale-1.0 runs), so the only difference to those runs is data.split_seed.
# Explicit variants (no grid) so only the missing cells are generated; ordered by split seed so that
# consecutive runs share a data split (train.py rebuilds Data_split only when the split seed changes).
#
#   python scripts/tactile_ablation/generate_config_variants.py \
#       --template-config configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml \
#       --spec configs/generation_specs/final_ablation_rot1_missing_spec.yml \
#       --output-dir configs/generated/final_ablation_rot1_missing/
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  group_aware_split: true
  model.backbone_trainable: true
  model.rot_scaling_factor: 1.0
  training.lr_backbone: 5e-05
  training.seed: 50
  training.early_stopping.enabled: true
  training.early_stopping.patience: 10
  training.early_stopping.min_delta: 0.01
  training.early_stopping.smoothing_alpha: 0.3

variants:
  - name: gated
    overrides:
      data.split_seed: 36
      model.fusion: gated
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16

  - name: residual_gated_concat
    overrides:
      data.split_seed: 36
      model.fusion: residual_gated_concat
      model.dual_fusion: false
      model.mlp_quat_1: 256
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 0
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 1024
      model.mlp_trans_3: 16

  - name: channelwise_residual_gated_concat_local
    overrides:
      data.split_seed: 36
      model.fusion: channelwise_residual_gated_concat_local
      model.dual_fusion: false
      model.mlp_quat_1: 2048
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 512
      model.mlp_trans_1: 1024
      model.mlp_trans_2: 256
