model:
  backbone: yolo26n.pt
  freeze_backbone: false
  streams:
  - rgb_image
  - digit_image
  fusion: gated_concat
  head_type: quaternion
  rotation_loss_type: geodesic
  normalize_translation: true
  activation: GELU
  mlp_quat_1: 1024
  mlp_quat_2: 1024
  mlp_quat_3: 512
  mlp_trans_1: 256
  mlp_trans_2: 128
  mlp_trans_3: 64

training:
  seed: 42
  lr: 0.0005
  batch_size: 16
  epochs: 150
  num_workers: 4
  optimizer: AdamW
  uncertainty_weighting:
    enabled: false
  dropout_rot: 0.1
  dropout_trans: 0.1
  use_batchnorm: false
  lr_schedule:
    enabled: true
    type: one_cycle
    pct_start: 0.15        # Shorten the warm-up so it doesn't build too much momentum
    start_lr_mult: 0.2     # Start low
    max_lr_mult: 1.0       # Be aware of strange behavior if the LR to exceeds the base LR
    final_lr_mult: 0.001   # Drop much lower to allow fine-tuning of the rotation angle
  head_lr_decay:
    enabled: false
  task_weighting:
    enabled: true
    type: uncertainty
data:
  root:  "D:/MA/FusionModel/data" #/home/MA_Flavia/Documents/FusionModel/Data
  streams:
  - mono_cam
  - tactile
  image_size: 640
  use_rgb: true
  use_tactile: true
  use_depth: false
  augmentation:
    enabled: false
    seed: 42
    photo_count: 1
    overwrite: false
  normalize_translation: true
