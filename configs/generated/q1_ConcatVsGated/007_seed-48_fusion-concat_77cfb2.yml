model:
  backbone: yolo26n.pt
  freeze_backbone: false
  streams:
  - rgb_image
  - digit_image
  fusion: concat
  head_type: quaternion
  rotation_loss_type: geodesic
  normalize_translation: true
  activation: GELU
  mlp_quat_1: 4096
  mlp_quat_2: 2048
  mlp_quat_3: 512
  mlp_trans_1: 1024
  mlp_trans_2: 256
  mlp_trans_3: 64
  dual_fusion: false
  translation_head_mode: joint
  spatial_grid_size: 10
training:
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.01
  seed: 48
data:
  root: /home/MA_Flavia/Documents/FusionModel/Data
  streams:
  - mono_cam
  - tactile
  image_size: 640
  use_rgb: true
  use_tactile: true
  use_depth: false
  augmentation:
    enabled: false
    seed: 42
    photo_count: 1
    overwrite: false
  normalize_translation: true
  group_aware_split: true
  split_seed: 40
group_aware_split: true
