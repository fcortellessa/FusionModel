# Auto-generated by queue_lr_schedule_gentleness.sh once the winning mlp_quat_3
# value was determined from q2_channelwise_headsearch_manual (quat_3=512) and
# q2_channelwise_quat3_followup (quat_3=0, quat_3=256). Winning head:
# mlp_quat_1=2048, mlp_quat_2=1024, mlp_quat_3=512, mlp_trans_2=256,
# mlp_trans_3=64.
#
# Tests whether the current lr_schedule (pct_start=0.05, start_lr_mult=0.5,
# final_lr_mult=0.05) is too aggressive, via single-factor-isolated gentler
# variants -- the current schedule's own already-measured score serves as the
# baseline (no need to rerun it).
template_config: configs/generated/q2_optuna_channelwise_backbone_trainable_template.yml

fixed_overrides:
  model.mlp_quat_1: 2048
  model.mlp_quat_2: 1024
  model.mlp_quat_3: 512
  model.mlp_trans_2: 256
  model.mlp_trans_3: 64

variants:
  - name: gentler_warmup_only
    overrides:
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.3
      training.lr_schedule.final_lr_mult: 0.05

  - name: gentler_decay_only
    overrides:
      training.lr_schedule.pct_start: 0.05
      training.lr_schedule.start_lr_mult: 0.5
      training.lr_schedule.final_lr_mult: 0.15

  - name: gentler_both
    overrides:
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.3
      training.lr_schedule.final_lr_mult: 0.15
