output_dir: "configs/generated/dual_fusion_joint_trans"

fixed_overrides:
  data.augmentation.enabled: false
  model.fusion: gated_concat
  model.translation_head_mode: "joint"
  training.batch_size: 32
  training.epochs: 50
  training.deterministic: true
  training.lr_schedule.type: "one_cycle"
  training.grad_clip.enabled: true
  training.grad_clip.max_norm: 1.0
  data.root: D:/MA/FusionModel/data
  task_feature_adapter.enabled: true

grid:
  training.seed: [43, 44, 45]
  model.dual_fusion: [true, false]
  task_feature_adapter.type: ["gated_concat"] #, "residual_gated_concat"]

