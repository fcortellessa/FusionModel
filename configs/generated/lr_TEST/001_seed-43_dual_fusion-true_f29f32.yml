model:
  backbone: yolo26n.pt
  freeze_backbone: false
  streams:
  - rgb_image
  - digit_image
  fusion: gated_concat
  head_type: quaternion
  rotation_loss_type: geodesic
  normalize_translation: true
  activation: GELU
  mlp_quat_1: 1024
  mlp_quat_2: 1024
  mlp_quat_3: 512
  mlp_trans_1: 256
  mlp_trans_2: 128
  mlp_trans_3: 64
  translation_head_mode: joint
  dual_fusion: true
training:
  seed: 43
  lr: 0.0005
  batch_size: 32
  epochs: 50
  num_workers: 4
  optimizer: AdamW
  uncertainty_weighting:
    enabled: false
  dropout_rot: 0.1
  dropout_trans: 0.1
  use_batchnorm: false
  lr_schedule:
    enabled: true
    type: one_cycle
    pct_start: 0.15
    start_lr_mult: 0.2
    max_lr_mult: 1.0
    final_lr_mult: 0.001
  head_lr_decay:
    enabled: false
  task_weighting:
    enabled: true
    type: uncertainty
  deterministic: true
  grad_clip:
    enabled: true
    max_norm: 1.0
data:
  root: D:/MA/FusionModel/data
  streams:
  - mono_cam
  - tactile
  image_size: 640
  use_rgb: true
  use_tactile: true
  use_depth: false
  augmentation:
    enabled: false
    seed: 42
    photo_count: 1
    overwrite: false
  normalize_translation: true
task_feature_adapter:
  enabled: true
  type: gated_concat
