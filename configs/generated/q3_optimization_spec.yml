# Q3 Spec: Task-Specific Optimization (LR & Uncertainty)
# Purpose: Compare global LR vs. per-head LR vs. uncertainty weighting
# Base: Your winner config (gated_concat with uncertainty)
# Vary: training.head_lr_decay and training.task_weighting configs
# Grid: 3 explicit variants (not seed-based)

template_config: configs/generated/q3_global_lr.yml

variants:
  # Variant 1: Global LR only (no per-head, no uncertainty)
  - name: "global_lr"
    fixed_overrides:
      model.fusion: gated_concat
      model.dual_fusion: false
      model.head_type: quaternion
      model.rotation_loss_type: geodesic
      model.activation: GELU
      model.mlp_quat_1: 1024
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 512
      model.mlp_trans_1: 256
      model.mlp_trans_2: 128
      model.mlp_trans_3: 64

      training.seed: 43
      training.lr: 0.0005
      training.batch_size: 16
      training.epochs: 50
      training.optimizer: AdamW
      training.dropout_rot: 0.1
      training.dropout_trans: 0.1
      training.use_batchnorm: false
      training.lr_schedule.enabled: true
      training.lr_schedule.type: one_cycle
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.2
      training.lr_schedule.max_lr_mult: 1.0
      training.lr_schedule.final_lr_mult: 0.001
      training.head_lr_decay.enabled: false
      training.task_weighting.enabled: false
      training.deterministic: true
      training.grad_clip.enabled: true
      training.grad_clip.max_norm: 1.0

      data.use_rgb: true
      data.use_tactile: true
      data.augmentation.enabled: false

  # Variant 2: Per-head LR decay (adaptive per-task learning rates)
  - name: "per_head_lr"
    fixed_overrides:
      model.fusion: gated_concat
      model.dual_fusion: false
      model.head_type: quaternion
      model.rotation_loss_type: geodesic
      model.activation: GELU
      model.mlp_quat_1: 1024
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 512
      model.mlp_trans_1: 256
      model.mlp_trans_2: 128
      model.mlp_trans_3: 64

      training.seed: 43
      training.lr: 0.0005
      training.batch_size: 16
      training.epochs: 50
      training.optimizer: AdamW
      training.dropout_rot: 0.1
      training.dropout_trans: 0.1
      training.use_batchnorm: false
      training.lr_schedule.enabled: true
      training.lr_schedule.type: one_cycle
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.2
      training.lr_schedule.max_lr_mult: 1.0
      training.lr_schedule.final_lr_mult: 0.001
      training.head_lr_decay.enabled: true
      training.head_lr_decay.patience: 5
      training.head_lr_decay.factor: 0.3
      training.head_lr_decay.min_lr_mult: 0.05
      training.task_weighting.enabled: false
      training.deterministic: true
      training.grad_clip.enabled: true
      training.grad_clip.max_norm: 1.0

      data.use_rgb: true
      data.use_tactile: true
      data.augmentation.enabled: false

  # Variant 3: Uncertainty weighting (learned task balancing)
  - name: "uncertainty"
    fixed_overrides:
      model.fusion: gated_concat
      model.dual_fusion: false
      model.head_type: quaternion
      model.rotation_loss_type: geodesic
      model.activation: GELU
      model.mlp_quat_1: 1024
      model.mlp_quat_2: 1024
      model.mlp_quat_3: 512
      model.mlp_trans_1: 256
      model.mlp_trans_2: 128
      model.mlp_trans_3: 64

      training.seed: 43
      training.lr: 0.0005
      training.batch_size: 16
      training.epochs: 50
      training.optimizer: AdamW
      training.dropout_rot: 0.1
      training.dropout_trans: 0.1
      training.use_batchnorm: false
      training.lr_schedule.enabled: true
      training.lr_schedule.type: one_cycle
      training.lr_schedule.pct_start: 0.15
      training.lr_schedule.start_lr_mult: 0.2
      training.lr_schedule.max_lr_mult: 1.0
      training.lr_schedule.final_lr_mult: 0.001
      training.head_lr_decay.enabled: false
      training.task_weighting.enabled: true
      training.task_weighting.type: uncertainty
      training.deterministic: true
      training.grad_clip.enabled: true
      training.grad_clip.max_norm: 1.0

      data.use_rgb: true
      data.use_tactile: true
      data.augmentation.enabled: false
