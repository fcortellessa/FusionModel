# Q4: is early specialization (dual fusion) better than late specialization
# (a task-feature adapter on a shared fusion)? Both variants build on
# gated_concat as the common base (has real learnable gate parameters, unlike
# plain concat -- see conversation history for why dual+concat would be a
# degenerate/parameter-free comparison). "Shared only" (plain gated_concat,
# no adapter, no dual_fusion) is NOT re-run here -- reuse the existing
# q2_ScalarVsChannelwise_gradclip results (seeds 46-50) as that baseline.
#
# - task_specific_gated_concat: gated_concat + task_feature_adapter
#   (residual_gate type -- see conversation history for why residual_gate over
#   channel_attention: the latter blows up to ~2B params at this model's
#   fused_dim=44800, residual_gate stays a fixed ~2.9M/adapter regardless of
#   fused_dim). 120 epochs (not the default 80): adds ~5.42% new,
#   near-identity-initialized parameters that need training time to learn a
#   deviation from identity, unlike dual_fusion's gate copy which behaves
#   like baseline from step one.
# - dual_gated_concat: gated_concat + dual_fusion (independent gate per task
#   branch instead of one shared gate). Only +1.33% params, no cold-start
#   identity-adapter behavior, so kept at the same 80 epochs as baseline for
#   direct comparability.
#
# Template: the actual baseline gated_concat/seed46 config from
# q2_ScalarVsChannelwise_gradclip, so grad_clip/warmup_cosine/early_stopping/
# weight_decay/etc. are identical to the baseline being compared against --
# only the two things being tested (task_feature_adapter, dual_fusion) plus
# epochs (for the adapter variant only) differ.
template_config: configs/generated/q2_ScalarVsChannelwise_gradclip/001_seed-46_fusion-gated_concat_3959bf.yml

fixed_overrides:
  data.split_seed: 40
  group_aware_split: true

grid:
  training.seed: [46, 47, 48, 49, 50]

variants:
  - name: task_specific_gated_concat
    overrides:
      model.task_feature_adapter.enabled: true
      model.task_feature_adapter.type: "residual_gate"
      training.epochs: 120

  - name: dual_gated_concat
    overrides:
      model.dual_fusion: true
      training.epochs: 80
