model:
  backbone: yolo26n.pt
  # NOTE: freeze_backbone has been a no-op since this model was written --
  # ultralytics' YOLO(...) loader returns every backbone parameter with
  # requires_grad=False already, and this flag only ever set requires_grad=False
  # (never back to True), so every run in this project's history with
  # freeze_backbone=false (the near-universal setting, including this default)
  # has actually trained with a FULLY FROZEN backbone regardless of this value.
  # It stays a no-op deliberately, to preserve exact backward compatibility with
  # every existing run/comparison. Use backbone_trainable (below) to actually
  # enable backbone gradients -- a separate, explicit opt-in.
  freeze_backbone: false
  # Opt-in for actually training the backbone (see freeze_backbone's note above).
  # Default false preserves every prior run's behavior exactly. True is the
  # first time this project would train the backbone rather than run it frozen.
  # Raises at construction if combined with freeze_backbone: true (contradictory).
  # backbone_trainable: true
  streams: ["rgb_image", "digit_image"]
  fusion: "concat" # concat | gated_concat | residual_gated_concat |
  # channelwise_gated_concat | channelwise_residual_gated_concat |
  # scale_gated_concat: like gated_concat, but with one independent sigmoid gate
  # per stream PER PYRAMID SCALE (P3/P4/P5) instead of one gate per stream total --
  # a middle ground between gated_concat (can't distinguish scales at all) and
  # channelwise_gated_concat_local (can, but empirically converges to nearly
  # identical P3/P4/P5 gate values anyway, see the final_ablation gate
  # diagnostics). 1D pipeline only (needs PoseEstimationNet.stream_scale_dims).

  # True dual fusion: build two independent instances of the `fusion` module above
  # (separate learned parameters), one combining the RGB/tactile streams for the
  # rotation branch and one for the translation branch, instead of sharing a single
  # fused vector between both heads. Off by default; incompatible with head_type
  # 'se3_direct' (that head needs one joint fused vector).
  dual_fusion: false
  # Optional: initial sigmoid gate output (before training) for the gated_concat
  # fusion family (gated_concat / residual_gated_concat / channelwise_gated_concat*
  # / channelwise_residual_gated_concat*, including _local/_hybrid), set via the
  # gate's bias term. Unset (or omitted, or null) leaves every fusion class at its
  # own default of 0.5 -- identical to the previous zero-bias init, fully backward
  # compatible. Must be strictly between 0 and 1 when set (e.g. 0.88 biases the
  # gate toward trusting/passing through both streams at init, without capping
  # where it can move to over training -- unlike a hard floor). Ignored by fusion
  # types that don't expose this (concat, attention, the softmax/sigmoid
  # weighted-sum "gated" family, spatial_gated_2d).
  # gate_init_prob: 0.88
  head_type: quaternion
  # Multiplies the raw rotation loss (geodesic angle, radians -- or the handler's
  # own native unit for other head_types) before it's summed with translation MSE,
  # so the two loss terms are numerically comparable (see "Unit balancing" in
  # CLAUDE.md). Unset (or omitted, or null; the default) leaves every handler at
  # its own hardcoded default -- 200.0 for quaternion/angle/lie_algebra, 2000.0 for
  # 2D_unit_vector -- identical to every existing run/config. Those hardcoded
  # defaults are NOT derived from matching raw loss magnitudes (an empirical check
  # via a fresh, untrained forward pass on real data found raw rotation loss and
  # raw translation MSE already within ~2x of each other at initialization, given
  # this project's translation representation isn't actually normalized -- see the
  # MEAN_Y/STD_Y pitfall in utils/normalization.py) -- so 200.0 should not be
  # treated as a principled value if you disable training.task_weighting, which
  # otherwise adaptively corrects for whatever imbalance a fixed value leaves.
  # rot_scaling_factor: 200.0
  # separate: independent y_head/z_head MLPs (default, current behavior).
  # joint: single trans_head MLP outputting both y and z together.
  translation_head_mode: separate
  activation: GELU
  mlp_quat_1: 1024
  mlp_quat_2: 1024
  mlp_quat_3: 512
  mlp_trans_1: 256
  mlp_trans_2: 128
  mlp_trans_3: 64
  # CORRECTED NOTE (this comment was wrong until now): despite the description this
  # key used to carry, spatial_grid_size does NOT affect the 1D pipeline (gated_concat
  # / channelwise_gated_concat* / anything not spatial_gated_2d) at all -- P3/P4/P5 are
  # downsampled there via fixed, hardcoded stride-2 convolutions
  # (base_model/pose_estimation_model.py's forward_single_stream), always producing
  # 20x20/10x10/5x5 regardless of this value. It's referenced only inside the 2D-fusion
  # (spatial_gated_2d) branch's fused_dim calculation, which itself refers to
  # `self.spatial_grid_size` -- an attribute that is never actually assigned anywhere in
  # PoseEstimationNet, so that reference is dead/unreachable too. In short:
  # spatial_grid_size has never done anything, for any fusion type, despite every
  # config (including this default) setting it. Kept here unchanged for backward
  # compatibility (existing configs still parse); use pre_head_grid_size below for the
  # real, working equivalent on the 1D pipeline.
  spatial_grid_size: 10
  # Optional real mechanism (new) to shrink the 1D pipeline's pre-head bottleneck:
  # applies an extra AdaptiveAvgPool2d to P3/P4/P5 (same target size for all three)
  # right before flattening, on top of the fixed 20x20/10x10/5x5 stride-conv output
  # above. The head's first layer is otherwise a single dense projection out of the
  # full flattened size (e.g. rot_head's first layer is ~183.5M of its ~192.9M total
  # parameters at the current fixed sizes) -- this shrinks that projection's input.
  # Unset (or omitted, or null) skips the extra pooling entirely, fully backward
  # compatible with every existing run. Accepts a single int (square grid) or a
  # [h, w] pair. Sizes larger than 5 (P5's current smallest dimension) pool P5
  # upward rather than down, so values <= 5 are the ones that actually shrink all
  # three scales.
  # pre_head_grid_size: 6

training:
  lr: 0.001
  # Optional: starting LR for the fusion module's own parameters (the fusion
  # module named `model.fusion` / `fusion_rotation` / `fusion_translation`,
  # e.g. the channel-wise gate's conv/MLP layers), given its own optimizer
  # param group instead of sharing `lr` with the pretrained backbone. Unset
  # (or omitted) falls back to `lr`, matching the previous behavior where the
  # fusion module was lumped into the backbone's "base" param group. Follows
  # the same global LR schedule as "base" (scaled from this starting value),
  # but does NOT get HeadLRDecayManager's per-head plateau decay.
  # lr_fusion: 0.005
  # Optional: starting LR for the backbone's own parameters (model.feature_extractors.*).
  # Only meaningful when model.backbone_trainable: true -- otherwise those parameters
  # have requires_grad=False and never appear in any optimizer param group regardless
  # of this value. Unset (or omitted) falls back to `lr`. Same schedule behavior as
  # lr_fusion (tracks the global LR schedule from this starting value, no per-group
  # plateau decay).
  # lr_backbone: 0.0001
  batch_size: 16
  epochs: 50
  num_workers: 4
  optimizer: Adam
  # L2 weight regularization, passed to the optimizer's native weight_decay kwarg
  # (decoupled for AdamW). Defaults to 0.0 (off) to preserve existing baselines.
  weight_decay: 0.0
  # Task weighting modes:
  # - uncertainty: learned log-variance weighting
  # - gradnorm: gradient-norm balancing
  # - dwa: dynamic weight average
  task_weighting:
    enabled: false
    type: uncertainty  # uncertainty | gradnorm | dwa
    # Uncertainty-only settings:
    init_log_var_rot: 0.0
    init_log_var_trans: 0.0
    lr_mult: 1.0
    # GradNorm-only settings:
    # gradnorm_lr: 1.0e-4
    # gradnorm_alpha: 0.5
    # DWA-only settings:
    # dwa_temperature: 2.0
  # Gradient-norm clipping (applied to all model parameters, after loss.backward()
  # and before optimizer.step()). Disabled by default to preserve existing baselines.
  grad_clip:
    enabled: false
    max_norm: 1.0
  dropout_rot: 0.3
  dropout_trans: 0.1
  use_batchnorm: True
  lr_schedule:
    enabled: true
    type: warmup_cosine   # warmup_cosine | reduce_on_plateau | none
    # warmup_cosine-only settings:
    pct_start: 0.2
    start_lr_mult: 0.2
    final_lr_mult: 0.05
    # reduce_on_plateau-only settings (stock torch.optim.lr_scheduler.ReduceLROnPlateau,
    # applied to every param group together, stepped on val_loss each epoch):
    # patience: 5
    # factor: 0.2
    # min_lr: 0.0
    # min_delta: 0.0   # min absolute val_loss improvement to reset patience; filters noise
  head_lr_decay:
    enabled: false
    patience: 5
    factor: 0.2
    # min_delta: 0.0   # RELATIVE improvement fraction (0.01 == 1%) of that head's metric to reset patience
    # smoothing_alpha: 1.0   # EMA factor on each head's val_abs_* metric before it is compared (1.0 = raw, no
    #                        # smoothing; 0.3 ~ 3-4 epoch window). Same convention as early_stopping /
    #                        # checkpoint_selection.smoothing_alpha.
    # Per-head torch ReduceLROnPlateau floor, one scheduler per head off that head's own
    # val_abs metric (val_abs_rot_x for rotation; val_abs_trans, or val_abs_y/val_abs_z with
    # separate translation heads) -- not the composite val_loss. Same mechanism as
    # lr_schedule's reduce_on_plateau (which does use val_fixed_loss), scoped per head. Legacy
    # key: floor as a fraction of each head's base_lr. Prefer 'min_lr' (absolute LR floor,
    # aligned with lr_schedule.min_lr) in new configs; 'min_lr' takes precedence if both are set.
    min_lr: 0.00001
    min_lr_mult: 0.00001
  early_stopping:
    enabled: false
    # CORRECTED NOTE (this comment was wrong until now): this is NOT checked
    # against val_loss. utils/train_utils.py's PerHeadEarlyStoppingManager is the
    # only early-stopping class scripts/train.py ever instantiates (the
    # val_loss-based EarlyStoppingManager class exists but is dead code, never
    # called) -- it stops once BOTH val_abs_rot_x (degrees) and val_abs_trans
    # (meters) have independently gone `patience` consecutive epochs without a
    # min_delta relative improvement. Training still stops no later than `epochs`.
    patience: 10
    min_delta: 0.0
    # Optional EMA smoothing (new) applied to val_abs_rot_x/val_abs_trans before
    # comparing against the running best, instead of comparing raw per-epoch
    # values. 1.0 (default) = no smoothing, identical to the previous behavior.
    # Lower = more smoothing (e.g. 0.3 ~ a 3-4 epoch effective window) -- use this
    # if a run stops prematurely on a noisy metric (see
    # q2_channelwise_backbone_trainable, where val_abs_trans swung 30-50% epoch
    # to epoch within a single run and one lucky low epoch set an unrealistically
    # strict bar for every subsequent epoch to clear).
    # smoothing_alpha: 0.3
  checkpoint_selection:
    # Which criterion decides whether the current epoch overwrites checkpoint_best.pth.
    # "combined_loss" (default): val_fixed_loss = val_loss_q*rot_scaling_factor + val_loss_y
    # + val_loss_z improves vs. the running best -- the only behavior that ever existed
    # before this key was added, so omitting this block entirely is identical to
    # "combined_loss".
    # "per_head_pareto": utils/train_utils.py's PerHeadCheckpointSelector instead --
    # compares EMA-smoothed val_abs_rot_x (degrees) and val_abs_trans (meters) against
    # the values at the last-saved checkpoint, and saves when neither head regresses by
    # more than min_delta (relative) and at least one improves by more than min_delta.
    # Unlike early_stopping's AND-gated per-head check, this does not require both heads
    # to improve together -- see PerHeadCheckpointSelector's docstring for why a strict
    # AND would stall too early once rotation/translation start trading off.
    # "both": checkpoint_best.pth keeps using combined_loss (so resume/test.py behavior
    # is untouched), and a second file, checkpoint_best_per_head.pth, is written
    # alongside it whenever the per_head_pareto criterion fires -- use this to A/B
    # compare the two selection strategies on one run before switching the primary over.
    type: combined_loss
    min_delta: 0.02
    # smoothing_alpha: 0.3   # same convention as early_stopping.smoothing_alpha above

data:
  root: ""
  # Optional: seed used only for the train/val/test split. Defaults to training.seed
  # when omitted, so existing configs are unaffected. Set this explicitly (and keep it
  # fixed) when sweeping training.seed, so the sweep measures model/training variance
  # rather than data-partition variance. The split is only rebuilt when split_seed (or
  # the ratios/source data) actually changes -- see Data_split/split_manifest.json.
  split_seed: null
  streams: ["mono_cam", "tactile"]
  image_size: 640
  use_rgb: true
  use_tactile: true
  use_depth: false
  augmentation:
    enabled: false
    seed: 42
    photo_count: 1
    overwrite: false
  # Whether translation targets (y/z) are z-scored before being handed to the
  # model. When true, mean/std are computed from this run's own train split
  # (see data_processing/preprocess_data.py::compute_translation_norm_stats)
  # and written into `translation_norm_stats` below at training time -- do not
  # set that sub-key by hand, it's populated automatically and snapshotted into
  # every run's config.yml so predictions can be un-normalized consistently
  # at eval time (see scripts/test.py).
  normalize_translation: true
  translation_norm_stats: {}
  # Data pipeline. "legacy" (default): per-run split + float32 .pt cache in <root>/Data_split,
  # rebuilt in place whenever split_seed changes -- unsafe for concurrent jobs. "compact": read-only
  # frozen split file + shared uint8 cache (data_processing/compact_cache.py); same input tensors,
  # safe for any number of parallel / array jobs. Prepare once with scripts/cluster/prepare_data.py.
  # The FUSIONMODEL_DATA_ROOT environment variable overrides `root` (e.g. on a cluster).
  pipeline: legacy
  # compact only (relative paths are resolved under the data root):
  split_dir: splits                 # holds split_<split_seed>.json (frozen by prepare_data.py freeze-splits)
  compact_cache_dir: compact_cache  # built by prepare_data.py build-cache
  # split_file: <path>              # optional explicit split file instead of split_dir/split_<seed>.json
  # split_file_sha256 is written automatically into each run's config snapshot; test.py refuses to
  # evaluate a compact run if its split file changed since training.

# Set `data.root` to the folder containing your samples:
# {timestamp}.json, {timestamp}.png, {timestamp}_digit.png

# Example
#  python train.py --config configs/exp_attention.yaml
#  python train.py --config config.yml