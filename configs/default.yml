model:
  backbone: yolo26n.pt
  freeze_backbone: false
  streams: ["rgb_image", "digit_image"]
  fusion: "concat"
  head_type: quaternion
  activation: GELU
  mlp_quat_1: 1024
  mlp_quat_2: 1024
  mlp_quat_3: 512
  mlp_trans_1: 256
  mlp_trans_2: 128
  mlp_trans_3: 64

training:
  lr: 0.001
  batch_size: 16
  epochs: 50
  num_workers: 4
  optimizer: Adam
  # Task weighting modes:
  # - uncertainty: learned log-variance weighting
  # - gradnorm: gradient-norm balancing
  # - dwa: dynamic weight average
  task_weighting:
    enabled: false
    type: uncertainty  # uncertainty | gradnorm | dwa
    # Uncertainty-only settings:
    init_log_var_rot: 0.0
    init_log_var_trans: 0.0
    lr_mult: 1.0
    # GradNorm-only settings:
    # gradnorm_lr: 1.0e-4
    # gradnorm_alpha: 0.5
    # DWA-only settings:
    # dwa_temperature: 2.0
  dropout_rot: 0.3
  dropout_trans: 0.1
  use_batchnorm: True
  lr_schedule:
    enabled: true
    type: one_cycle
    pct_start: 0.2
    start_lr_mult: 0.2
    max_lr_mult: 3.0
    final_lr_mult: 0.05
  head_lr_decay:
    enabled: false
    patience: 5
    factor: 0.2
    min_lr_mult: 0.00001
  early_stopping:
    enabled: false
    # Stop once val_loss hasn't improved by more than min_delta for this many
    # consecutive epochs (checked against the same val_loss used for checkpoint
    # selection). Training still stops no later than `epochs`.
    patience: 10
    min_delta: 0.0

data:
  root: ""
  # Optional: seed used only for the train/val/test split. Defaults to training.seed
  # when omitted, so existing configs are unaffected. Set this explicitly (and keep it
  # fixed) when sweeping training.seed, so the sweep measures model/training variance
  # rather than data-partition variance. The split is only rebuilt when split_seed (or
  # the ratios/source data) actually changes -- see Data_split/split_manifest.json.
  split_seed: null
  streams: ["mono_cam", "tactile"]
  image_size: 640
  use_rgb: true
  use_tactile: true
  use_depth: false
  augmentation:
    enabled: false
    seed: 42
    photo_count: 1
    overwrite: false

# Set `data.root` to the folder containing your samples:
# {timestamp}.json, {timestamp}.png, {timestamp}_digit.png

# Example
#  python train.py --config configs/exp_attention.yaml
#  python train.py --config config.yml